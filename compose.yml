# Deployment stack for the VPS — one file for every environment; the env file
# supplies what differs (STACK_NAME, APP_DOMAIN, images, credentials):
#   docker compose --env-file .env.<stack> up -d
#
# Expects the shared Traefik reverse proxy running with an external network
# named "traefik" (docker network create traefik).
#
# No service publishes ports — Traefik is the only entry point. App-internal
# traffic (web -> api -> postgres) stays on the stack-private network so
# multiple stacks on the same Traefik network cannot collide on DNS names;
# STACK_NAME keeps the Traefik router names unique across stacks.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

  api:
    image: ${API_IMAGE:?}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      # Behind Traefik (one hop), so rate limiting keys on the real
      # client IP, not the proxy. Overridable for stacks with more layers.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Login attempts per IP per minute. The default is the real policy;
      # only the e2e stack raises it (see .env.localtest).
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      # Inquiry + registration posts per IP per minute. Same story.
      PUBLIC_FORM_RATE_LIMIT: ${PUBLIC_FORM_RATE_LIMIT:-10}
      # Signs the session JWT. Required — no default, so a stack
      # without it fails fast rather than booting with a guessable key.
      JWT_SECRET: ${JWT_SECRET:?}
      # SMTP. Provided per stack: Mailpit for demo/localtest, a real
      # provider for prod. USER/PASSWORD/SECURE are optional (Mailpit needs none).
      MAIL_HOST: ${MAIL_HOST:?}
      MAIL_PORT: ${MAIL_PORT:?}
      MAIL_FROM: ${MAIL_FROM:?}
      # Staff inbox: inquiries and new-registration notices.
      MAIL_STAFF_TO: ${MAIL_STAFF_TO:?}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      # Server-only email wording, loaded whole from a file in the ./config
      # mount below; the branding on those mails comes from the same mount's
      # deployment.json, and APP_ORIGIN makes their links absolute.
      MAIL_TEXT_FILE: ${MAIL_TEXT_FILE:-/config/mail-text.json}
      DEPLOYMENT_CONFIG_FILE: ${DEPLOYMENT_CONFIG_FILE:-/config/deployment.json}
      APP_ORIGIN: https://${APP_DOMAIN:?}
      # Uploaded images land on the shared media volume; the media service
      # serves them read-only at /media.
      MEDIA_ROOT: /media
      # In-process orphan prune: the server sweeps unreferenced uploads on
      # a timer. Defaults live in the API's env schema; a stack overrides here —
      # notably MEDIA_PRUNE_DRY_RUN=true to watch a first prod sweep before it deletes.
      MEDIA_PRUNE_INTERVAL_HOURS: ${MEDIA_PRUNE_INTERVAL_HOURS:-24}
      MEDIA_PRUNE_GRACE_HOURS: ${MEDIA_PRUNE_GRACE_HOURS:-24}
      MEDIA_PRUNE_DRY_RUN: ${MEDIA_PRUNE_DRY_RUN:-false}
      # What is deployed, shown in the admin panel. Written into the stack's
      # .env by infra/deploy.sh (derived from the image tag), so a plain local
      # `up` leaves them empty and the panel reports "unknown".
      APP_VERSION: ${APP_VERSION:-}
      APP_DEPLOYED_AT: ${APP_DEPLOYED_AT:-}
    volumes:
      - ./config:/config:ro
      - mediadata:/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-admin:
        condition: service_completed_successfully
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.${STACK_NAME:?}-api.rule=Host(`${APP_DOMAIN:?}`) && PathPrefix(`/api`)
      - traefik.http.routers.${STACK_NAME:?}-api.entrypoints=websecure
      - traefik.http.routers.${STACK_NAME:?}-api.tls.certresolver=letsencrypt
      - traefik.http.services.${STACK_NAME:?}-api.loadbalancer.server.port=3000

  web:
    image: ${WEB_IMAGE:?}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      # Public origin of this stack; the SSR transfer cache maps internal API
      # fetches to it so hydrated pages don't refetch. Overridden for the
      # TLS-less local smoke test in compose.override.yml.
      APP_ORIGIN: https://${APP_DOMAIN:?}
      WEB_PORT: 4000
      # Indexing opt-in. Off unless the deployment env sets it true
      # (the private prod stack at go-live); dev and the demo stay noindex.
      SEO_INDEXABLE: ${SEO_INDEXABLE:-false}
      # SSR reaches the API directly on the stack network, not through Traefik.
      API_URL: http://api:3000/api
      # SSR-injected chrome config and UI text, loaded whole from files in the
      # ./config mount below.
      DEPLOYMENT_CONFIG_FILE: ${DEPLOYMENT_CONFIG_FILE:-/config/deployment.json}
      APP_TEXT_FILE: ${APP_TEXT_FILE:-/config/app-text.json}
      ADMIN_TEXT_FILE: ${ADMIN_TEXT_FILE:-/config/admin-text.json}
      # Per-deployment asset overrides (logo, favicon) live in the assets subdir
      # of the same mount: served by the SSR server.
      CONFIG_ASSETS_DIR: /config/assets
    volumes:
      - ./config:/config:ro
    depends_on:
      - api
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      # Longer rules win in Traefik, so /api requests never land here.
      - traefik.http.routers.${STACK_NAME:?}-web.rule=Host(`${APP_DOMAIN:?}`)
      - traefik.http.routers.${STACK_NAME:?}-web.entrypoints=websecure
      - traefik.http.routers.${STACK_NAME:?}-web.tls.certresolver=letsencrypt
      - traefik.http.services.${STACK_NAME:?}-web.loadbalancer.server.port=4000

  # Static server for uploaded images (0021). Traefik cannot serve files, so a
  # tiny nginx exposes the shared media volume read-only at /media, with an
  # immutable cache policy (filenames are content hashes). On the internal
  # network too, so the local smoke-test proxy can reach it by name.
  media:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - mediadata:/srv/media:ro
      - ./infra/media/media.conf:/etc/nginx/conf.d/default.conf:ro
    # Let the api initialize the shared mediadata volume first. The api image
    # creates /media owned by the unprivileged `node` user, so whichever
    # container mounts the empty volume first sets its ownership — this nginx
    # runs as root and would seed it root-owned, leaving the node api unable to
    # write uploads. Ordering the api ahead makes the volume node-owned.
    depends_on:
      - api
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      # More specific than the web catch-all, so /media never lands on web.
      - traefik.http.routers.${STACK_NAME:?}-media.rule=Host(`${APP_DOMAIN:?}`) && PathPrefix(`/media`)
      - traefik.http.routers.${STACK_NAME:?}-media.entrypoints=websecure
      - traefik.http.routers.${STACK_NAME:?}-media.tls.certresolver=letsencrypt
      - traefik.http.services.${STACK_NAME:?}-media.loadbalancer.server.port=80

  # One-shot migrator — reuses the API image in RUN_MODE=migrate to apply
  # pending migrations, then exits. Not in a profile: plain `up` runs it.
  migrate:
    image: ${API_IMAGE:?}
    restart: 'no'
    environment:
      RUN_MODE: migrate
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # One-shot admin bootstrap — reuses the API image in RUN_MODE=bootstrap-admin
  # to create the seeded admin if it does not already exist (create-if-missing:
  # never overwrites a changed password or real content), then exits. Unlike the
  # dev-only content `seed`, this runs on every `up` in every environment —
  # including prod — so an admin always exists. api waits on it completing.
  bootstrap-admin:
    image: ${API_IMAGE:?}
    restart: 'no'
    environment:
      RUN_MODE: bootstrap-admin
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # One-shot seeder — reuses the API image in RUN_MODE=seed to upsert seed
  # data, then exits. In the 'tools' profile so `up` never starts it.
  seed:
    image: ${API_IMAGE:?}
    profiles: ['tools']
    restart: 'no'
    environment:
      RUN_MODE: seed
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      # Seeds generate placeholder images through the same media store the api
      # writes uploads to, so the seeder needs the root and the shared volume —
      # without them the seed crashes on an undefined path. The api (which runs
      # first in a SEED=1 deploy) has already created /media node-owned.
      MEDIA_ROOT: /media
    volumes:
      - mediadata:/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # Scheduled logical backups (NFR-OPS-04).
  # In the 'backup' profile: long-lived stacks opt in via COMPOSE_PROFILES=backup
  # in their .env; the ephemeral demo omits it, so this never starts there.
  db-backup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    profiles: ['backup']
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # Scheduled media backups (NFR-OPS-04, ADR 0028) — the second data class the
  # db-backup job deliberately does not cover. Same 'backup' profile, so a stack
  # opts into both at once and the ephemeral demo starts neither.
  #
  # Runs *after* the database dump, and that order is the whole point: uploads
  # are append-only, so an archive taken later than the dump always contains
  # every image the dump references. The reverse order can restore a catalog
  # pointing at files that were never archived.
  #
  # No docker socket: nothing has to be stopped for a consistent copy of an
  # append-only directory, so the container gets the volume read-only and
  # nothing else.
  media-backup:
    image: offen/docker-volume-backup:v2
    profiles: ['backup']
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: ${MEDIA_BACKUP_SCHEDULE:-30 1 * * *}
      BACKUP_FILENAME: 'media-%Y-%m-%dT%H-%M-%S.tar.gz'
      BACKUP_LATEST_SYMLINK: media-latest.tar.gz
      BACKUP_PRUNING_PREFIX: 'media-'
      BACKUP_RETENTION_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - mediadata:/backup/media:ro
      - ./backups/media:/archive

networks:
  internal:
  traefik:
    external: true

volumes:
  pgdata:
  # Uploaded images (0021). Written by api, served by media. Backed up by the
  # media-backup sidecar above into ./backups/media (ADR 0028), on the same
  # 'backup' profile as the database dump.
  mediadata:
