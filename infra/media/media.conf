# Static file server for uploaded media. Shared by the deploy stack
# (behind Traefik) and the local stacks. Files are content-addressed, so a URL's
# bytes never change — they are cached hard and immutably. Only the /media
# subtree is exposed; anything else is a 404.
server {
  listen 80;
  server_tokens off;
  root /srv;

  location /media/ {
    # No `always`: the immutable cache must apply to successful responses only.
    # A transient 404 (e.g. a file not yet visible) must NOT be cached, or the
    # browser keeps serving "missing" until a forced reload.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
