# Static file server for uploaded media and product documents. Shared by the
# deploy stack (behind Traefik) and the local stacks. Files are content-addressed,
# so a URL's bytes never change — they are cached hard and immutably. Only the
# /media and /documents subtrees are exposed; anything else is a 404.
server {
  listen 80;
  server_tokens off;
  root /srv;

  location /media/ {
    # No `always`: the immutable cache must apply to successful responses only.
    # A transient 404 (e.g. a file not yet visible) must NOT be cached, or the
    # browser keeps serving "missing" until a forced reload.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The documents subdirectory has exactly one URL, and it is the one below.
  # Without this, /media/documents/<file> would serve the same bytes from the
  # image location, uncached differently and with no inline disposition.
  location /media/documents/ {
    return 404;
  }

  # Product documents: the same volume, a subdirectory of it, served under
  # their own prefix because their bytes are stored unmodified. Inline, so a
  # certificate opens in the browser's viewer rather than downloading.
  location /documents/ {
    alias /srv/media/documents/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Disposition "inline";
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
