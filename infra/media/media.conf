# Static file server for uploaded media. Shared by the deploy stack
# (behind Traefik) and the local stacks. Files are content-addressed, so a URL's
# bytes never change — they are cached hard and immutably. Only the /media
# subtree is exposed; anything else is a 404.
server {
  listen 80;
  server_tokens off;
  root /srv;

  location /media/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
