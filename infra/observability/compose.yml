# Shared observability stack — one instance per VM, started once (like the
# Traefik proxy in ../traefik), serving every app stack on the host. Collects
# each container's stdout into Loki and exposes it through Grafana.
#
#   docker network create traefik          # once per VM (shared with Traefik)
#   docker compose --env-file .env up -d    # in this directory (see .env.example)
#
# Opt-in per VM: deploy.sh brings this up only when handed OBSERVABILITY_ENV.
# Long-lived dev/prod run it; the ephemeral demo omits it (its logs die with the
# VM) and local testing uses `docker compose logs` instead.
name: observability

services:
  # Log store. Single Go binary, filesystem storage, label-indexed — the
  # deliberately-not-Elasticsearch choice. Not exposed to Traefik; only Alloy
  # (push) and Grafana (query) reach it on the internal network.
  loki:
    image: grafana/loki:3.5
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - loki:/loki
    configs:
      - source: loki_config
        target: /etc/loki/config.yaml
    networks:
      - observability

  # Collector. Tails every container's stdout via the read-only Docker socket
  # (same pattern Traefik uses) and ships to Loki, decoupled so a Loki outage
  # never back-pressures the app. Runs as root to read the socket.
  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    user: root
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy/data
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - observability

  # Disk usage as a log line, every five minutes.
  #
  # Disk is the one resource that actually ends this deployment: uploads only
  # grow, backups keep two retention policies, Loki holds 14 days. But it is a
  # *metric*, and this VM deliberately has no metrics store (a CPU/memory
  # dashboard would show flat lines on a box using ~10% of its RAM). Emitting it
  # as a log line lets the existing Loki pipeline carry it, and Grafana alert on
  # it, without adding Prometheus and an exporter for one number.
  disk-usage:
    image: alpine:3.22
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while true; do
          df -P /host | awk 'NR==2 {gsub(/%/,"",$5);
            printf "{\"level\":\"info\",\"filesystem\":\"host-root\",\"used_percent\":%s,\"avail_kb\":%s}\n", $5, $4}'
          sleep 300
        done
    volumes:
      # Read-only, and only to read its free space.
      - /:/host:ro
    networks:
      - observability

  # UI. Provisioned with Loki as its default datasource; exposed on its own ops
  # hostname over TLS through Traefik, guarded by Grafana's own login.
  grafana:
    image: grafana/grafana-oss:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?}
      # Public-internet hardening. Anonymous view off; no self-service signup.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Disable the HTTP basic-auth API path so credentials can only be tried
      # through the login form, where Grafana's brute-force lockout applies
      # (5 failures -> temporary block, on by default).
      GF_AUTH_BASIC_ENABLED: 'false'
      # Session cookie only over TLS, not sent cross-site; HSTS on responses.
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: 'true'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      # Keep a self-hosted, air-gapped-ish UI quiet — no phone-home.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      # Alert delivery. The same SMTP account the app sends with; alerts are
      # rare and low-volume, so they do not warrant their own sender.
      # Opt-in, like the observability stack itself: a VM that has not been
      # given SMTP still runs Loki/Grafana, it just cannot mail. Required vars
      # here would stop the stack booting on every deploy that predates them.
      GF_SMTP_ENABLED: ${SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-}
      GF_SMTP_FROM_NAME: ${GRAFANA_DOMAIN:?} alerts
      GF_SMTP_SKIP_VERIFY: ${SMTP_SKIP_VERIFY:-false}
      # Read by the provisioned contact point below. Never empty: Grafana
      # *refuses to start* if a provisioned email contact point has no
      # addresses, so an unconfigured VM would crash-loop rather than simply
      # run without alerting. `.invalid` is reserved by RFC 2606 and cannot
      # resolve, so the placeholder can never mail a real person; with
      # SMTP_ENABLED=false nothing is attempted anyway.
      ALERT_EMAIL: ${ALERT_EMAIL:-alerts-not-configured@invalid}
    volumes:
      - grafana:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/loki.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/provider.yaml
      - source: grafana_dashboard_traffic
        target: /var/lib/grafana/dashboards/traffic.json
      - source: grafana_dashboard_search
        target: /var/lib/grafana/dashboards/search.json
      - source: grafana_contact_points
        target: /etc/grafana/provisioning/alerting/contact-points.yaml
      - source: grafana_alert_rules
        target: /etc/grafana/provisioning/alerting/rules.yaml
    depends_on:
      - loki
    networks:
      - observability
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.observability-grafana.rule=Host(`${GRAFANA_DOMAIN:?}`)
      - traefik.http.routers.observability-grafana.entrypoints=websecure
      - traefik.http.routers.observability-grafana.tls.certresolver=letsencrypt
      - traefik.http.services.observability-grafana.loadbalancer.server.port=3000

configs:
  # Minimal single-binary Loki: filesystem storage, in-memory ring, 14-day
  # retention enforced by the compactor.
  loki_config:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
        log_level: warn
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 336h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

  # Discover running containers, relabel the compose metadata into tidy
  # stack/service/container labels, tail their logs, push to Loki.
  alloy_config:
    content: |
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "containers" {
        targets = discovery.docker.containers.targets

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
          target_label  = "stack"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service"
        }
        // Grafana's Logs Drilldown groups by `service_name`; without it every
        // container on the VM collapses into a single entry and the dev/prod
        // split is invisible there (Explore can still filter on `stack`).
        // Qualified by stack, so `dev/api` and `prod/api` stay distinct.
        rule {
          source_labels = [
            "__meta_docker_container_label_com_docker_compose_project",
            "__meta_docker_container_label_com_docker_compose_service",
          ]
          separator    = "/"
          target_label = "service_name"
        }
      }

      loki.source.docker "containers" {
        host          = "unix:///var/run/docker.sock"
        targets       = discovery.docker.containers.targets
        relabel_rules = discovery.relabel.containers.rules
        forward_to    = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki:3100
          isDefault: true
          jsonData:
            maxLines: 1000

  # Dashboards are provisioned from files, not clicked together in the UI: the
  # Grafana volume is disposable, and a dashboard that only exists in it is one
  # VM rebuild from gone. `allowUiUpdates: false` keeps the file authoritative —
  # edits in the UI are for exploring, and have to come back here to survive.
  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: b2b
          type: file
          allowUiUpdates: false
          options:
            path: /var/lib/grafana/dashboards

  # Request-level view, entirely from Traefik's access logs — no app code feeds
  # it (ADR 0016). Fields are trimmed at the source (infra/traefik/compose.yml);
  # this only decides how they are read.
  #
  # One Traefik fronts every stack on the VM, so every panel scopes itself by
  # ServiceName — otherwise dev, prod and Grafana's own UI are summed into one
  # figure, and "most viewed pages" reports whoever last opened this dashboard.
  # The `stack` variable picks dev/prod/demo; the ops stack is excluded outright
  # rather than being one more thing to remember to deselect.
  #
  # `$$` throughout: Compose interpolates `$` inside a config's content, and the
  # dashboard is full of Grafana macros ($__auto, $__range) and a regex group
  # reference. Compose writes them back out as a single `$`.
  grafana_dashboard_traffic:
    content: |
      {
        "uid": "b2b-traffic",
        "title": "B2B \u2014 traffic & errors",
        "description": "Request-level view built from Traefik access logs (ADR 0016). No application code feeds this.",
        "tags": [
          "b2b"
        ],
        "timezone": "browser",
        "schemaVersion": 39,
        "version": 1,
        "refresh": "1m",
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "stack",
              "label": "Stack",
              "type": "custom",
              "description": "Which stack's traffic to show. Traefik names its services `<STACK_NAME>-<service>@docker`, so the stack is readable off every access log line. A fixed list rather than a query: RequestHost and ServiceName are fields extracted by `| json` at query time, not indexed Loki labels, and label_values can only enumerate the latter. A deployment whose STACK_NAME is not listed here is still covered by All.",
              "query": "dev,prod,demo",
              "options": [
                {
                  "text": "dev",
                  "value": "dev",
                  "selected": false
                },
                {
                  "text": "prod",
                  "value": "prod",
                  "selected": false
                },
                {
                  "text": "demo",
                  "value": "demo",
                  "selected": false
                }
              ],
              "includeAll": true,
              "allValue": ".+",
              "multi": true,
              "current": {
                "text": "All",
                "value": "$$__all"
              }
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "title": "Access log",
            "type": "logs",
            "description": "Traefik access logs, one readable line per request. The JSON fields are still underneath for filtering \u2014 this only changes how they read.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 10,
              "w": 24,
              "x": 0,
              "y": 0
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "{service=\"traefik\"} | json | ServiceName=~\"($$stack)-.*\" | ServiceName!~\"observability-.*\" | line_format \"{{.RequestMethod}} {{.RequestPath}} -> {{.DownstreamStatus}} ({{ div .Duration 1000000 }}ms) {{.ServiceName}}\"",
                "queryType": "range"
              }
            ],
            "options": {
              "showTime": true,
              "wrapLogMessage": false,
              "sortOrder": "Descending",
              "enableLogDetails": true
            }
          },
          {
            "id": 2,
            "title": "Requests by status",
            "type": "timeseries",
            "description": "Every response Traefik served, grouped by status.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 10
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "sum by (DownstreamStatus) (count_over_time(({service=\"traefik\"} | json | ServiceName=~\"($$stack)-.*\" | ServiceName!~\"observability-.*\")[$$__auto]))",
                "queryType": "range",
                "legendFormat": "{{DownstreamStatus}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Server errors (5xx)",
            "type": "timeseries",
            "description": "A page that cannot load its data answers 503 rather than 200 (LoadErrorView), so an outage shows up here instead of passing silently.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 10
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "sum(count_over_time(({service=\"traefik\"} | json | ServiceName=~\"($$stack)-.*\" | ServiceName!~\"observability-.*\" | DownstreamStatus >= 500)[$$__auto]))",
                "queryType": "range",
                "legendFormat": "5xx"
              }
            ]
          },
          {
            "id": 4,
            "title": "Latency p95 (ms)",
            "type": "timeseries",
            "description": "`by ()` collapses the per-path series into one figure; Traefik reports Duration in nanoseconds.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 18
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "quantile_over_time(0.95, ({service=\"traefik\"} | json | ServiceName=~\"($$stack)-.*\" | ServiceName!~\"observability-.*\" | unwrap Duration)[$$__auto]) by () / 1e6",
                "queryType": "range",
                "legendFormat": "p95"
              }
            ]
          },
          {
            "id": 5,
            "title": "Most viewed products",
            "type": "barchart",
            "description": "A product view takes two shapes: the server-rendered page request, and the /api call a client-side navigation makes instead. The slug is normalised out of both so they sum instead of splitting. Crawlers are included \u2014 headers are dropped, so there is no User-Agent to exclude them by.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 18
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "topk(10, sum by (product) (count_over_time(({service=\"traefik\"} | json | ServiceName=~\"($$stack)-.*\" | ServiceName!~\"observability-.*\" | RequestPath=~\"/product/.+|/api/catalog/products/.+\" | label_format product=`{{ regexReplaceAll \".*/products?/([^/?]+).*\" .RequestPath \"$${1}\" }}`)[$$__range])))",
                "queryType": "instant",
                "legendFormat": "{{product}}"
              }
            ]
          },
          {
            "id": 6,
            "title": "Most viewed pages",
            "type": "barchart",
            "description": "Assets and API calls excluded, so this is pages a person asked for. Query strings are trimmed, so `/products` and `/products?page=2` count as one page. Crawlers and vulnerability scanners are still included — headers are dropped, so there is no User-Agent to exclude them by, and `/.env`-style probes will show up here.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 26
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "topk(10, sum by (page) (count_over_time(({service=\"traefik\"} | json | ServiceName=~\"($$stack)-.*\" | ServiceName!~\"observability-.*\" | RequestPath!~\"/api/.*\" | RequestPath!~\"/media/.*\" | RequestPath!~\".*\\\\.(js|css|map|ico|png|jpg|jpeg|webp|avif|svg|json|txt|xml|woff|woff2|ttf)([?].*)?\" | label_format page=`{{ regexReplaceAll \"[?].*\" .RequestPath \"\" }}`)[$$__range])))",
                "queryType": "instant",
                "legendFormat": "{{page}}"
              }
            ]
          }
        ]
      }
  # Search usage (NFR-OPS-05), the one dashboard fed by application logs rather
  # than by the edge: Traefik does not keep query strings, and no access log
  # knows how many rows a search returned. The api container emits one
  # `[Search]` line per executed search (apps/api/src/catalog/search.logger.ts);
  # the `q=/results=/ms=` shape of that line is what the regexp below parses, so
  # the two change together.
  #
  # Scoped by the `stack` label rather than by a JSON field: unlike the traffic
  # dashboard's Traefik lines, these come from the app container directly, and
  # Alloy labels every line with its compose project.
  #
  # `$$` throughout, as in the traffic dashboard: Compose interpolates `$`
  # inside a config's content and writes `$$` back out as one `$`.
  grafana_dashboard_search:
    content: |
      {
        "uid": "b2b-search",
        "title": "B2B — search usage",
        "description": "What visitors search for and what the catalog answers (NFR-OPS-05). Built from the api container's [Search] log lines; every panel but the log one counts first-page requests only, so paging through results does not inflate a query's count.",
        "tags": [
          "b2b"
        ],
        "timezone": "browser",
        "schemaVersion": 39,
        "version": 1,
        "refresh": "5m",
        "time": {
          "from": "now-7d",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "stack",
              "label": "Stack",
              "type": "custom",
              "description": "Which deployment's searches to show. `stack` is the compose project name, applied as a Loki label by Alloy, so dev and prod stay separable. A deployment whose STACK_NAME is not listed here is still covered by All.",
              "query": "dev,prod,demo",
              "options": [
                {
                  "text": "dev",
                  "value": "dev",
                  "selected": false
                },
                {
                  "text": "prod",
                  "value": "prod",
                  "selected": false
                },
                {
                  "text": "demo",
                  "value": "demo",
                  "selected": false
                }
              ],
              "includeAll": true,
              "allValue": ".+",
              "multi": true,
              "current": {
                "text": "All",
                "value": "$$__all"
              }
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "title": "Searches with no results",
            "type": "barchart",
            "description": "The panel this dashboard exists for: queries a visitor typed and got an empty page for. Each one is either a product the catalog does not carry, or one it carries under a name nobody searches by — the first is a buying decision, the second a renaming one. Queries are normalised (lower-cased, punctuation dropped), so spelling variants group.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 9,
              "w": 24,
              "x": 0,
              "y": 0
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "topk(10, sum by (query) (count_over_time(({service=\"api\", stack=~\"($$stack)\"} | json | context=\"Search\" | line_format `{{.message}}` | regexp `q=\"(?P<query>[^\"]*)\" terms=(?P<terms>\\d+) results=(?P<results>\\d+) page=(?P<page>\\d+) ms=(?P<ms>\\d+)` | page=\"1\" | results=\"0\")[$$__range])))",
                "queryType": "instant",
                "legendFormat": "{{query}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Most searched terms",
            "type": "barchart",
            "description": "What the shop is asked for, hits or not. Read next to the panel above: a query that is both frequent and empty is the most expensive gap in the catalog.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 0,
              "y": 9
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "topk(10, sum by (query) (count_over_time(({service=\"api\", stack=~\"($$stack)\"} | json | context=\"Search\" | line_format `{{.message}}` | regexp `q=\"(?P<query>[^\"]*)\" terms=(?P<terms>\\d+) results=(?P<results>\\d+) page=(?P<page>\\d+) ms=(?P<ms>\\d+)` | page=\"1\")[$$__range])))",
                "queryType": "instant",
                "legendFormat": "{{query}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Search volume",
            "type": "timeseries",
            "description": "Searches run, and how many of them came back empty. A rising empty share is the signal to open the panel above; a flat total says the search bar is simply not being used.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 9,
              "w": 12,
              "x": 12,
              "y": 9
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "sum(count_over_time(({service=\"api\", stack=~\"($$stack)\"} | json | context=\"Search\" | line_format `{{.message}}` | regexp `q=\"(?P<query>[^\"]*)\" terms=(?P<terms>\\d+) results=(?P<results>\\d+) page=(?P<page>\\d+) ms=(?P<ms>\\d+)` | page=\"1\")[$$__auto]))",
                "queryType": "range",
                "legendFormat": "searches"
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "sum(count_over_time(({service=\"api\", stack=~\"($$stack)\"} | json | context=\"Search\" | line_format `{{.message}}` | regexp `q=\"(?P<query>[^\"]*)\" terms=(?P<terms>\\d+) results=(?P<results>\\d+) page=(?P<page>\\d+) ms=(?P<ms>\\d+)` | page=\"1\" | results=\"0\")[$$__auto]))",
                "queryType": "range",
                "legendFormat": "no results"
              }
            ]
          },
          {
            "id": 4,
            "title": "Search latency p95 (ms)",
            "type": "timeseries",
            "description": "Time spent in the matcher itself — count plus page, measured in the API around the transaction, so it excludes rendering and the network. NFR-PERF's budget is a page-load one; this is the half the search code owns. `by ()` collapses the per-query series into one figure.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 18
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "quantile_over_time(0.95, ({service=\"api\", stack=~\"($$stack)\"} | json | context=\"Search\" | line_format `{{.message}}` | regexp `q=\"(?P<query>[^\"]*)\" terms=(?P<terms>\\d+) results=(?P<results>\\d+) page=(?P<page>\\d+) ms=(?P<ms>\\d+)` | page=\"1\" | unwrap ms)[$$__auto]) by ()",
                "queryType": "range",
                "legendFormat": "p95"
              }
            ]
          },
          {
            "id": 5,
            "title": "Recent searches",
            "type": "logs",
            "description": "Every executed search, including paging requests. Nothing identifying is recorded — no address, no session — so a query cannot be traced back to the visitor who typed it.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 10,
              "w": 12,
              "x": 12,
              "y": 18
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "{service=\"api\", stack=~\"($$stack)\"} | json | context=\"Search\" | line_format `{{.message}}` | regexp `q=\"(?P<query>[^\"]*)\" terms=(?P<terms>\\d+) results=(?P<results>\\d+) page=(?P<page>\\d+) ms=(?P<ms>\\d+)` | line_format `{{.query}} → {{.results}} hits ({{.ms}}ms) page {{.page}}`",
                "queryType": "range"
              }
            ],
            "options": {
              "showTime": true,
              "wrapLogMessage": false,
              "sortOrder": "Descending",
              "enableLogDetails": true
            }
          }
        ]
      }
  # Where alerts go. `${ALERT_EMAIL}` is interpolated by Grafana from its own
  # environment at load time (doubled below so Compose leaves it alone).
  grafana_contact_points:
    content: |
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: ops-email
          receivers:
            - uid: ops-email
              type: email
              settings:
                addresses: $${ALERT_EMAIL}
                singleEmail: true
      policies:
        - orgId: 1
          receiver: ops-email
          group_by: [alertname]
          group_wait: 30s
          group_interval: 5m
          # Re-send a still-firing alert once a day: often enough not to be
          # forgotten, rarely enough not to be filtered into a folder.
          repeat_interval: 24h

  # Alerts on the three things that actually take this deployment down, all
  # answered from logs — no metrics store involved.
  grafana_alert_rules:
    content: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: b2b
          folder: Alerts
          interval: 5m
          rules:
          - uid: disk-above-80
            title: Disk above 80%
            condition: C
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Disk on the VM is above 80%
              description: >-
                Uploads and backups only grow. Free space before the database has nowhere to write: prune old backups, or grow the volume.
            noDataState: NoData
            execErrState: Error
            data:
              - refId: A
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: loki
                model:
                  refId: A
                  datasource: {type: loki, uid: loki}
                  expr: 'max_over_time({service="disk-usage"} | json | unwrap used_percent [10m])'
                  queryType: range
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  reducer: last
                  expression: A
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [80]
          - uid: backup-failing
            title: Backup job reporting errors
            condition: C
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: A backup job logged an error in the last hour
              description: >-
                The database dump or the media archive is failing. A backup nobody checks is not a backup — see infra/README.md for taking one by hand.
            noDataState: OK
            execErrState: Error
            data:
              - refId: A
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: loki
                model:
                  refId: A
                  datasource: {type: loki, uid: loki}
                  expr: 'sum(count_over_time({service=~"db-backup|media-backup"} |~ `(?i)error|fail` [1h]))'
                  queryType: range
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  reducer: max
                  expression: A
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
          - uid: error-rate
            title: Elevated server errors
            condition: C
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: More than 20 server errors in 10 minutes
              description: >-
                A page whose data cannot load answers 503, so an API or database outage shows up here rather than as silent 200s.
            noDataState: OK
            execErrState: Error
            data:
              - refId: A
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: loki
                model:
                  refId: A
                  datasource: {type: loki, uid: loki}
                  expr: 'sum(count_over_time({service="traefik"} | json | DownstreamStatus >= 500 [10m]))'
                  queryType: range
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  reducer: max
                  expression: A
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [20]

networks:
  observability:
  traefik:
    external: true

volumes:
  loki:
  grafana:
  alloy:
