services:
  postgres:
    image: postgres:18-alpine
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - '127.0.0.1:${DATABASE_PORT:?}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}']
      interval: 2s
      timeout: 3s
      retries: 15

  # Dev/e2e email sink: accepts SMTP on 1025, shows caught mail on
  # the web UI at http://localhost:8025. Nothing is sent onward.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAIL_PORT:?}:1025'
      - '127.0.0.1:8025:8025'

  # Serves images the dev api writes to MEDIA_ROOT (./.media) so `nx serve`
  # sees the same /media route as production; the web dev-server proxy forwards
  # /media here (see apps/web/proxy.conf.js).
  media:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MEDIA_PORT:?}:80'
    volumes:
      - ./.media:/srv/media:ro
      - ./infra/media/media.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
